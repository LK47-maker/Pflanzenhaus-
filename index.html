<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#2a1e16;color:#3a2414;font-family:"Pixelify Sans",ui-monospace,monospace;overflow:hidden;user-select:none;-webkit-user-select:none}
#app{height:100dvh;display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);background:radial-gradient(120% 80% at 50% 40%,#5a4636,#2a1e16)}
img{image-rendering:pixelated}
#hud{display:flex;gap:8px;align-items:center;padding:10px 12px 6px}
.pill{display:flex;align-items:center;gap:6px;background:#fff1d6;border:3px solid #5a3a22;border-radius:8px;padding:4px 10px;font-size:20px;font-weight:700;box-shadow:0 3px 0 #2a1a0e;min-height:40px}
.pill img{width:22px;height:22px}
#dayPill{font-size:17px}
.pill{font-size:17px}
#bookBtn{margin-left:auto;font:inherit;font-size:15px;color:#3a2414;cursor:pointer}
#snd{font:inherit;font-size:15px;color:#3a2414;cursor:pointer}
#stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;position:relative;padding:0 6px}
#cv{image-rendering:pixelated;image-rendering:crisp-edges;border-radius:10px;box-shadow:0 0 0 3px #5a3a22,0 6px 0 3px #2a1a0e;touch-action:none;display:block}
#toast{position:absolute;left:50%;top:10px;transform:translate(-50%,-14px);max-width:min(92%,420px);background:#fff8e6;border:3px solid #5a3a22;border-radius:10px;padding:6px 10px;font-size:14px;line-height:1.25;text-align:center;box-shadow:0 3px 0 #2a1a0e;opacity:0;pointer-events:none;transition:.25s}
#toast.show{opacity:1;transform:translate(-50%,0)}
#bar{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;padding:8px 8px 10px}
.tool{position:relative;font:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:64px;background:#fff1d6;border:3px solid #5a3a22;border-radius:10px;box-shadow:0 4px 0 #2a1a0e;color:#3a2414;font-size:14px;font-weight:600;cursor:pointer;touch-action:manipulation;padding:4px 2px}
.tool img{width:30px;height:30px;object-fit:contain}
.tool:active{transform:translateY(3px);box-shadow:0 1px 0 #2a1a0e}
.tool.on{background:#ffd56a;border-color:#7a4a12}
.tool.act{background:#e8f4d8}
.tool .mini{position:absolute;top:3px;right:4px;width:18px;height:18px;object-fit:contain;background:#fff8e6;border:2px solid #5a3a22;border-radius:5px}
.badge{position:absolute;top:2px;right:6px;background:#5aa03a;color:#fff;border:2px solid #2a4a1a;border-radius:8px;font-size:12px;padding:0 5px;line-height:16px}
#picker{position:absolute;left:8px;right:8px;bottom:calc(92px + env(safe-area-inset-bottom));display:flex;gap:8px;overflow-x:auto;padding:10px;z-index:5;scrollbar-width:none}
.panel{background:#fff1d6;border:3px solid #5a3a22;border-radius:12px;box-shadow:0 5px 0 #2a1a0e}
.hidden{display:none!important}
.seedCard{font:inherit;flex:0 0 96px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 4px;background:#fff8e6;border:3px solid #c8a070;border-radius:10px;color:#3a2414;cursor:pointer}
.seedCard.on{border-color:#e09a1a;background:#ffe9a8}
.seedCard img{width:44px;height:44px;object-fit:contain}
.seedCard b{font-size:14px}
.seedCard small{font-size:12px;display:flex;align-items:center;gap:2px}
.seedCard.more{justify-content:center;background:#e8f4d8;border-style:dashed}
.cn{white-space:nowrap;display:inline-flex;align-items:center}
.ic{width:14px;height:14px;vertical-align:-2px;margin-right:2px}
#modal{position:fixed;inset:0;background:rgba(20,30,15,.55);display:flex;align-items:flex-end;justify-content:center;z-index:10;padding:10px 10px calc(10px + env(safe-area-inset-bottom))}
.sheet{width:min(100%,480px);max-height:82dvh;display:flex;flex-direction:column;padding:12px;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:0}}
.sheetHead{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.sheetHead h2{margin:0;font-size:24px}
#mClose{font:inherit;font-size:20px;width:40px;height:40px;border:3px solid #5a3a22;border-radius:10px;background:#ffd8c8;color:#3a2414;cursor:pointer}
#mBody{overflow-y:auto}
.tabs{display:flex;gap:6px;margin-bottom:8px}
.tab{font:inherit;flex:1;font-size:16px;padding:8px;border:3px solid #c8a070;background:#fff8e6;border-radius:10px;color:#3a2414;cursor:pointer}
.tab.on{background:#ffd56a;border-color:#7a4a12}
.row{display:flex;align-items:center;gap:10px;padding:8px;border-bottom:2px dashed #e0c49a}
.row.center{justify-content:center;text-align:center;border:0}
.row .grow{flex:1;display:flex;flex-direction:column;gap:2px}
.row b{font-size:17px}
.row small{font-size:13px;color:#6a4a30;display:flex;align-items:center;flex-wrap:wrap;gap:3px}
.big-ic{width:44px;height:44px;object-fit:contain;background:#e8f4d8;border-radius:8px;padding:3px}
.buy,.big{font:inherit;font-weight:700;font-size:16px;padding:8px 12px;border:3px solid #2a4a1a;background:#8ad05a;border-radius:10px;color:#1a2a10;box-shadow:0 3px 0 #2a4a1a;cursor:pointer;display:flex;align-items:center;white-space:nowrap}
.big{width:100%;justify-content:center;font-size:19px;padding:12px;margin-top:6px}
.buy:active,.big:active{transform:translateY(2px);box-shadow:0 1px 0 #2a4a1a}
.dis{background:#d8ccb8;border-color:#8a7a60;box-shadow:0 3px 0 #8a7a60;color:#6a5a48}
.done{font-size:22px;color:#3a8a30;padding:0 10px}
.hint{font-size:14px;color:#6a4a30;text-align:center}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px}
.stats div{background:#fff8e6;border:2px solid #e0c49a;border-radius:10px;padding:6px;text-align:center}
.stats b{display:block;font-size:22px}.stats small{font-size:12px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.card{background:#fff8e6;border:2px solid #e0c49a;border-radius:10px;padding:6px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px}
.card img{width:40px;height:40px;object-fit:contain}
.card b{font-size:14px}.card small{font-size:12px;color:#6a4a30}
.card.dim{opacity:.6}
#mBody h3{margin:12px 2px 6px;font-size:17px}
.row.rare{background:#fff3c8;border-radius:10px}
.ghost{font:inherit;margin:14px auto 4px;display:block;background:none;border:2px dashed #c8a070;border-radius:10px;padding:8px 14px;color:#8a6a4a;font-size:14px;cursor:pointer}

#hud{padding:8px 10px 4px}
.pill{white-space:nowrap}
#snd{min-width:44px;justify-content:center}
#bookBtn img{width:22px;height:22px}
#roomBar{display:flex;align-items:center;gap:8px;padding:2px 10px 6px}
#roomBar button{font:inherit;font-size:18px;width:44px;height:44px;flex:0 0 44px;border:3px solid #5a3a22;border-radius:10px;background:#fff1d6;color:#3a2414;box-shadow:0 3px 0 #2a1a0e;cursor:pointer;touch-action:manipulation}
#roomBar button:active{transform:translateY(2px);box-shadow:0 1px 0 #2a1a0e}
#roomName{flex:1;text-align:center;color:#fff1d6;display:flex;flex-direction:column;align-items:center;line-height:1.15}
#roomName b{font-size:20px}#roomName small{font-size:13px;opacity:.85}
#roomDots{display:flex;gap:5px;margin-top:3px}#roomDots i{width:7px;height:7px;border-radius:2px;background:#8a6a50}#roomDots i.on{background:#ffd56a}#roomDots i.lock{opacity:.45}
#roomLock{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(82%,330px);padding:14px;text-align:center;display:flex;flex-direction:column;gap:6px;z-index:3}
#roomLock b{font-size:22px}#roomLock small{font-size:14px;color:#6a4a30}
#heldChip{margin:0 8px;display:flex;align-items:center;gap:8px;padding:6px 8px;background:#fff6d0;border-color:#c89a2a}
#heldChip img{width:34px;height:34px;object-fit:contain}
#heldChip span{flex:1;font-size:14px;line-height:1.2}
#heldChip button{font:inherit;width:36px;height:36px;border:3px solid #5a3a22;border-radius:9px;background:#ffd8c8;cursor:pointer}
.tool{font-size:13px}
.roomH{display:flex;align-items:center;justify-content:space-between}
.tab.go{flex:0 0 auto;font-size:13px;padding:4px 10px}

#hud{gap:6px}
.pill{padding:4px 8px}
.manaS{color:#9a5ae0;font-size:20px;text-shadow:0 0 6px #c8a0ff}
#manaPill{background:#f2e8ff;border-color:#4a2a7a}
.spellHead{display:flex;align-items:center;gap:10px;padding:8px;background:linear-gradient(135deg,#2a2040,#4a3070);border-radius:10px;color:#f4ecff;margin-bottom:6px}
.spellHead img{width:48px;height:48px;object-fit:contain;background:#ffffff18;border-radius:8px}
.spellHead .grow{flex:1;display:flex;flex-direction:column}.spellHead b{font-size:17px}.spellHead small{font-size:13px;opacity:.85}
.manaBig{font-size:22px;font-weight:700;color:#e0c8ff;text-shadow:0 0 8px #a070f0}
.sIc{width:44px;height:44px;flex:0 0 44px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:24px;color:#fff;box-shadow:inset 0 -3px 0 #0003,0 0 10px #a070f066;border:3px solid #2a1a3a}
.buy.magic{background:#b48aff;border-color:#3a1a6a;box-shadow:0 3px 0 #3a1a6a;color:#1a0a2a}
.buy.magic.dis{background:#d8ccb8;border-color:#8a7a60;box-shadow:0 3px 0 #8a7a60;color:#6a5a48}
.why{color:#a04a4a!important}
.buy.armed{background:#ffb04a;border-color:#7a3a0a;box-shadow:0 3px 0 #7a3a0a}
#mBody .list h3{margin:14px 2px 4px}
.tabs .tab{min-width:0;padding:8px 4px;font-size:15px}
#mBody{overflow-x:hidden}

#modal.opening{pointer-events:none}
small,.hint,#toast,#heldChip span{font-family:ui-rounded,"SF Pro Rounded","Segoe UI",Roboto,system-ui,sans-serif;font-weight:600}
#coins,#mana,#day,.badge,.cn,.buy,.stats b,.manaBig,#roomInfo,.seedCard small{font-family:ui-rounded,"SF Pro Rounded","Segoe UI",Roboto,system-ui,sans-serif;font-weight:800;letter-spacing:.2px}
#coins,#mana{font-size:21px}
.badge{font-size:12px}
.ghost.tiny{font-size:12px;opacity:.55;margin-top:28px;border-style:dotted}
.ghost.armedR{opacity:1;color:#b03030;border-color:#b03030}
.houseImg{width:56px;height:84px;object-fit:cover;border-radius:8px;border:2px solid #5a3a22;image-rendering:pixelated;flex:0 0 56px}
.big.alt{background:#fff1d6;border-color:#5a3a22;box-shadow:0 3px 0 #5a3a22}
#hud{gap:5px;padding:8px 8px 4px}
.pill{padding:4px 7px;min-height:38px}
#coins,#mana{font-size:19px}
#dayPill{font-size:15px}
#roomDots{align-items:center}

#mBody>.tabs{position:sticky;top:0;z-index:3;background:#fff1d6;margin:0 0 8px;padding:2px 0 8px;box-shadow:0 6px 6px -6px #5a3a2266}
.row.hilite{background:#fff0b0;border-radius:10px;animation:hl 1.2s ease 2}@keyframes hl{50%{background:#ffd56a}}
</style>

<div id="app">
  <header id="hud">
    <div class="pill"><img id="icoCoin" alt=""><span id="coins">0</span></div>
    <div class="pill hidden" id="manaPill"><span class="manaS">✦</span><span id="mana">0</span></div>
    <div class="pill" id="dayPill"><img id="icoDay" alt=""><span id="day">Tag 1</span></div>

    <button class="pill" id="snd">♪</button>

  <div id="heldChip" class="panel hidden"></div>

    <button class="tool" data-tool="cut"><img id="icoCut" alt=""><span>Schere</span></button>
    <button class="tool" data-tool="move"><img id="icoMove" alt=""><span>Umstellen</span></button>
    <button class="tool act" id="shopBtn"><img id="icoShop" alt=""><span>Laden</span><b class="badge hidden" id="invN">0</b></button>
  </nav>
  <div id="modal" class="hidden"><div class="sheet panel"><div class="sheetHead"><h2 id="mTitle"></h2><button id="mClose" aria-label="Schließen">✕</button></div><div id="mBody"></div></div></div>
